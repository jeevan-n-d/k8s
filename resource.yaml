apiVersion: v1
kind: Pod

metadata:
  name: resource-demo

spec:
  containers:
  - name: stress-container

    image: polinux/stress

    command:
    - "stress"

    args:
    - "--cpu"
    - "1"
    - "--vm"
    - "1"
    - "--vm-bytes"
    - "1G"
    - "--vm-hang"
    - "1"

    resources:
      requests:
        memory: "10Mi"
        cpu: "1m"
