apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-replica
  labels:
    env: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      env: demo
  template:
    metadata:
      labels:
        env: demo
    spec:
      containers:
        - image: nginx
          name: nginx-pod
          ports:
            - containerPort: 80
